<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Error: Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg-cream: #f4f0ea;
  --text-black: #1a1a1a;
  --border-black: #1a1a1a;
  --placeholder-gray: rgba(26, 26, 26, 0.3);
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-mono: 'Space Mono', 'Courier New', monospace;
  --space-xs: 0.5rem;
  --space-sm: 1rem;
  --space-md: 2rem;
  --space-lg: 4rem;
  --space-xl: 6rem;
  --space-xxl: 10rem;
  --pad-x: 1.5rem;
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background-color: var(--bg-cream);
  color: var(--text-black);
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Navigation */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  padding: var(--space-md) var(--pad-x);
  display: flex;
  justify-content: space-between;
  align-items: center;
  mix-blend-mode: difference;
}

.nav-logo {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 400;
  text-transform: lowercase;
  letter-spacing: 0.08em;
  color: #ffffff;
}

.nav-links {
  display: flex;
  gap: var(--space-md);
  list-style: none;
}

.nav-links a {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 400;
  text-transform: lowercase;
  letter-spacing: 0.05em;
  color: #ffffff;
  position: relative;
  padding-bottom: 2px;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 1px;
  background-color: #ffffff;
  transition: width 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.nav-links a:hover::after {
  width: 100%;
}

/* Footer */
.footer {
  border-top: 1px solid var(--border-black);
  padding: var(--space-md) var(--pad-x);
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}

.footer-left,
.footer-right {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 400;
  text-transform: lowercase;
  letter-spacing: 0.03em;
}

.footer-right {
  display: flex;
  gap: var(--space-md);
  flex-wrap: wrap;
}

/* Page Title Area */
.page-title-area {
  padding: 160px var(--pad-x, 1.5rem) 60px;
  background: var(--text-black, #1a1a1a);
  color: var(--bg-cream, #f4f0ea);
}
.page-title-inner { max-width: 1200px; margin: 0 auto; }
.page-title-area h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.03em;
}

/* Content Area */
.content-area {
  padding: 64px var(--pad-x, 1.5rem);
  max-width: 1200px;
  margin: 0 auto;
}
.content-area h2 {
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 600;
  line-height: 1.15;
  margin-bottom: 24px;
}
.content-area p {
  font-size: 1rem;
  line-height: 1.7;
  margin-bottom: 24px;
}

/* 404 specific styles */
.error-block {
  text-align: center;
  padding: var(--space-xl) var(--pad-x);
}

.error-code {
  font-family: var(--font-serif);
  font-size: clamp(6rem, 20vw, 12rem);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.05em;
  margin-bottom: var(--space-md);
  opacity: 0.15;
}

.error-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 400;
  text-transform: lowercase;
  letter-spacing: 0.1em;
  margin-bottom: var(--space-sm);
}

.error-message {
  font-family: var(--font-serif);
  font-size: clamp(1.25rem, 3vw, 1.75rem);
  font-weight: 300;
  margin-bottom: var(--space-lg);
}

.error-home-link {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 400;
  text-transform: lowercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--border-black);
  padding: var(--space-sm) var(--space-md);
  transition: background-color 0.3s ease, color 0.3s ease;
}

.error-home-link:hover {
  background-color: var(--text-black);
  color: var(--bg-cream);
}

/* Tablet breakpoint */
@media (min-width: 768px) {
  :root {
    --pad-x: 3rem;
  }

  .footer {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}

/* Desktop breakpoint */
@media (min-width: 1024px) {
  :root {
    --pad-x: 4rem;
  }
}

/* Mobile breakpoint */
@media (max-width: 768px) {
  :root {
    --pad-x: 1rem;
  }

  .nav {
    padding: var(--space-sm) var(--pad-x);
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-xs);
  }

  .nav-links {
    flex-wrap: wrap;
    gap: var(--space-sm);
  }

  .nav-links a {
    font-size: 0.65rem;
  }

  .page-title-area {
    padding: 120px var(--pad-x) 40px;
  }

  .page-title-area h1 {
    font-size: clamp(1.5rem, 6vw, 2rem);
  }

  .content-area {
    padding: 40px var(--pad-x);
  }

  .error-code {
    font-size: clamp(4rem, 20vw, 8rem);
  }

  .error-message {
    font-size: clamp(1rem, 4vw, 1.25rem);
  }

  .footer {
    flex-direction: column;
    gap: var(--space-sm);
  }

  .footer-right {
    flex-direction: column;
    gap: var(--space-xs);
  }
}
</style>
</head>
<body>

<!-- HEADER -->
<nav class="nav">
  <a href="#" class="nav-logo">Joanna Injects</a>
  <ul class="nav-links">
    <li><a href="/">HOME</a></li>
    <li><a href="/services">SERVICES</a></li>
    <li><a href="/about">ABOUT</a></li>
    <li><a href="/policies">POLICIES</a></li>
    <li><a href="/faq">FAQ</a></li>
    <li><a href="/locations">LOCATIONS</a></li>
    <li><a href="/payment-plans">PAYMENT PLANS</a></li>
    <li><a href="/book-online">Book Online</a></li>
  </ul>
</nav>

<!-- Page Title -->
<section class="page-title-area">
  <div class="page-title-inner">
    <h1>404 Error: Page Not Found</h1>
  </div>
</section>

<!-- Page Content -->
<div class="content-area">
  <div class="error-block">
    <p class="error-label">ERROR: PAGE NOT FOUND</p>
    <div class="error-code">404</div>
    <p class="error-message">This page isn't available.</p>
    <a href="https://www.joannainjects.com/" class="error-home-link">Go to Homepage</a>
  </div>
</div>

<footer class="footer">
  <div class="footer-left">© 2024 Joanna Injects</div>
  <div class="footer-right">
    <span>zurich</span>
    <span>copenhagen</span>
    <span>tokyo</span>
  </div>
</footer>

</body>
</html>
